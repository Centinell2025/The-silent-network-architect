name: Package 14 DFIR labs
on:
  push:
    paths:
      - '.github/workflows/package-14-dfir-labs.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  complete-student-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check all laboratory manifests and CLI
        run: python3 tests/test_labs.py
      - name: Build self-contained student archive
        run: python3 tools/build_student_zip.py --write
      - name: Verify forensic and student artifact correctness
        run: |
          python3 tools/validate_evidence.py
          python3 tests/test_case_logic.py
          python3 tests/test_grading_handout.py
          python3 tests/test_labs.py
          python3 tests/test_package.py
          python3 tests/test_packet_fixture.py
          python3 tools/build_student_zip.py --check
      - name: Commit generated student ZIP
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/The-Silent-Network-Architect-Student.zip
          if ! git diff --cached --quiet; then
            git commit -m "Ship student package containing 14 Northbridge DFIR labs"
            git push origin HEAD:main
          fi
