name: Verify Sherlock evidence
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  forensic-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check evidence and cryptographic manifest
        run: python3 tools/validate_evidence.py
      - name: Check ZIP parity and solution isolation
        run: python3 tests/test_package.py
      - name: Validate non-spoiler cross-artifact invariants
        run: python3 tests/test_case_logic.py
      - name: Verify participant workbench and blank answer sheet
        run: python3 tests/test_workbench.py
      - name: Verify canonical 30-question grading consistency
        run: python3 tests/test_grading_handout.py
      - name: Guard repeatable student ZIP assembly
        run: python3 tools/build_student_zip.py --check
      - name: Verify synthetic packet-level forensic fixture
        run: python3 tests/test_packet_fixture.py
      - name: Verify packet-level investigation CLI
        run: python3 tools/packet_inspector.py summary
