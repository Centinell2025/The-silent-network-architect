name: Verify Sherlock evidence
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  forensic-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check evidence and cryptographic manifest
        run: python3 tools/validate_evidence.py
      - name: Check ZIP parity and solution isolation
        run: python3 tests/test_package.py
      - name: Validate cross-artifact scenario invariants
        run: python3 tests/test_case_logic.py
      - name: Verify participant workbench and blank answer sheet
        run: python3 tests/test_workbench.py
      - name: Verify exact-answer alternative questions
        run: python3 tests/test_grading_handout.py
