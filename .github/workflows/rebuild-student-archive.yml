name: Rebuild student archive
on:
  push:
    paths:
      - '.github/workflows/rebuild-student-archive.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build deterministic student ZIP from tracked sources
        run: python3 tools/build_student_zip.py --write
      - name: Commit rebuilt ZIP only if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/The-Silent-Network-Architect-Student.zip
          if ! git diff --cached --quiet; then
            git commit -m "Rebuild student ZIP with reproducible Python builder"
            git push origin HEAD:main
          fi
