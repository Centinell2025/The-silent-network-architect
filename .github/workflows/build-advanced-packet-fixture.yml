name: Build advanced offline packet fixture
on:
  push:
    paths:
      - '.github/workflows/build-advanced-packet-fixture.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate deterministic packet-level case fixture
        run: python3 tools/generate_synthetic_pcap.py --write
      - name: Refresh only authentic source-file hashes
        run: python3 tools/refresh_evidence_hashes.py
      - name: Rebuild self-contained participant archive
        run: python3 tools/build_student_zip.py --write
      - name: Exercise packet-level consistency test
        run: python3 tests/test_packet_fixture.py
      - name: Validate checksum and complete student ZIP
        run: |
          python3 tools/validate_evidence.py
          python3 tests/test_package.py
          python3 tools/build_student_zip.py --check
      - name: Commit reproducibly generated evidence artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/11_packet_fixture/ manifest/SHA256SUMS.txt downloads/The-Silent-Network-Architect-Student.zip
          if ! git diff --cached --quiet; then
            git commit -m "Generate synthetic PCAP and refresh signed case package"
            git push origin HEAD:main
          fi
